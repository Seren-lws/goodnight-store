<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#332a54"/>
      <stop offset="100%" stop-color="#1c1830"/>
    </linearGradient>
    <radialGradient id="moon" cx="35%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#fff7e6"/>
      <stop offset="70%" stop-color="#ffc98b"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <circle cx="200" cy="200" r="3" fill="#fff" opacity="0.7"/>
  <circle cx="360" cy="150" r="2.5" fill="#fff" opacity="0.6"/>
  <circle cx="340" cy="330" r="2" fill="#fff" opacity="0.5"/>
  <circle cx="150" cy="330" r="2.5" fill="#fff" opacity="0.55"/>

  <g filter="url(#glow)">
    <circle cx="290" cy="230" r="108" fill="url(#moon)"/>
    <circle cx="330" cy="200" r="96" fill="url(#bg)"/>
  </g>
</svg>
